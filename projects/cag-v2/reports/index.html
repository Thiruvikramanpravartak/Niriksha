<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="2; url=cucumber-report.html">
  <title>CAG v2 — Automated Test Execution Reports</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --primary: #238636;
      --primary-hover: #2ea043;
      --accent: #58a6ff;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 40px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
    }
    .container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 600px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.4);
      text-align: center;
    }
    h1 {
      color: var(--heading);
      margin-top: 0;
      font-size: 24px;
    }
    p {
      color: var(--text);
      line-height: 1.6;
      font-size: 15px;
    }
    .badge {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(35, 134, 54, 0.2);
      color: #3fb950;
      border: 1px solid rgba(63, 185, 80, 0.3);
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 16px;
    }
    .actions {
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .btn {
      display: block;
      padding: 12px 20px;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      font-size: 15px;
      transition: all 0.2s ease;
    }
    .btn-primary {
      background-color: var(--primary);
      color: #ffffff;
    }
    .btn-primary:hover {
      background-color: var(--primary-hover);
    }
    .btn-secondary {
      background-color: #21262d;
      color: var(--accent);
      border: 1px solid var(--border);
    }
    .btn-secondary:hover {
      background-color: #30363d;
    }
    .footer-note {
      font-size: 12px;
      color: #8b949e;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">CAG v2 E2E & UAT Automation</div>
    <h1>Cucumber Test Execution Report</h1>
    <p>Redirecting to the latest interactive Cucumber execution report...</p>
    
    <div class="actions">
      <a href="cucumber-report.html" class="btn btn-primary">Open Latest Cucumber HTML Report</a>
      <a href="history/index.json" class="btn btn-secondary">View Run History Metadata (JSON)</a>
    </div>

    <div class="footer-note">
      If redirect does not trigger automatically within 2 seconds, please click the button above.
    </div>
  </div>
</body>
</html>
